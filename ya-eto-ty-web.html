<script>
/* Я — Це Ти — Terminal Emulator */

class Terminal {
  constructor(outputEl, inputEl, promptEl, pauseOverlayEl) {
    this.output = outputEl;
    this.input = inputEl;
    this.prompt = promptEl;
    this.pauseOverlay = pauseOverlayEl;
    this.history = [];
    this.historyIdx = -1;
    this._readResolve = null;

    // ─── Input handling: MULTIPLE fallback events ────────────
    // Some mobile browsers / modes only fire 'input' or 'keypress' on Enter.
    this.input.addEventListener('keydown', (e) => this._onKey(e));
    this.input.addEventListener('keypress', (e) => this._onKeyPress(e));
    this.input.addEventListener('input', (e) => this._onInput(e));

    // Click anywhere to focus input
    document.addEventListener('click', () => this.input.focus());

    // Pause menu
    if (this.pauseOverlay) {
      this.pauseOverlay.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          this.hidePause();
          if (this._pauseCb) {
            const cb = this._pauseCb;
            this._pauseCb = null;
            cb(btn.dataset.action || 'continue');
          }
        });
      });
    }

    // Auto-focus on touch/click anywhere
    document.addEventListener('touchstart', () => this.input.focus());
  }

  // ─── Output ──────────────────────────────────────────────────────

  print(text, cls = 'default') {
    const span = document.createElement('span');
    span.className = `c-${cls}`;
    span.textContent = text;
    this.output.appendChild(span);
    this.output.appendChild(document.createTextNode('\n'));
    this._scroll();
  }

  write(text, cls = 'default') {
    const span = document.createElement('span');
    span.className = `c-${cls}`;
    span.textContent = text;
    this.output.appendChild(span);
    this._scroll();
  }

  writeln(text, cls = 'default') {
    this.write(text + '\n', cls);
  }

  heading(text) {
    const hr = '═'.repeat(60);
    this.print('');
    this.print(hr, 'yellow');
    this.print(`  ${text}`, 'yellow');
    this.print(hr, 'yellow');
    this.print('');
  }

  separator() {
    this.print('─'.repeat(60), 'gray');
  }

  // ─── Status bar helpers ──────────────────────────────────────────

  bar(value, length = 16) {
    const filled = Math.max(0, Math.min(length, Math.floor(value / 100 * length)));
    const empty = length - filled;
    const f = '█'.repeat(filled);
    const e = '░'.repeat(empty);
    return `[${f}${e}] ${value.toFixed(0)}%`;
  }

  clear() {
    this.output.innerHTML = '';
    this.input.value = '';
  }

  _scroll() {
    this.output.scrollTop = this.output.scrollHeight;
  }

  // ─── Prompt ─────────────────────────────────────────────────────

  setPrompt(text) {
    this.prompt.textContent = text || '$ ';
  }

  // ─── Input — returns a Promise<string> ────────────────────────────

  read() {
    return new Promise((resolve) => {
      this._readResolve = resolve;
      this.input.focus();
    });
  }

  // ─── Resolve current read with the input value ──────────────────

  _submit() {
    const val = this.input.value;
    if (val) {
      this.history.push(val);
      this.writeln(`${this.prompt.textContent}${val}`, 'default');
    } else {
      this.writeln('', 'default');
    }
    this.input.value = '';
    this.historyIdx = -1;

    if (this._readResolve) {
      const resolve = this._readResolve;
      this._readResolve = null;
      resolve(val);
    }
  }

  // ─── Event Handlers ─────────────────────────────────────────────

  _onKey(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      this._submit();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (this.history.length === 0) return;
      this.historyIdx = (this.historyIdx === -1)
        ? this.history.length - 1
        : Math.max(0, this.historyIdx - 1);
      this.input.value = this.history[this.historyIdx];
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (this.history.length === 0) return;
      this.historyIdx++;
      if (this.historyIdx >= this.history.length) {
        this.historyIdx = -1;
        this.input.value = '';
      } else {
        this.input.value = this.history[this.historyIdx];
      }
    } else if (e.key === 'c' && (e.ctrlKey || e.metaKey)) {
      if (this._readResolve) {
        this.writeln('^C', 'gray');
        this.input.value = '';
        const resolve = this._readResolve;
        this._readResolve = null;
        resolve('');
      }
    }
  }

  // Fallback for mobile — keypress fires on Enter too
  _onKeyPress(e) {
    if (e.key === 'Enter') {
      if (!this._readResolve) return; // already handled by keydown
      e.preventDefault();
      this._submit();
    }
  }

  // Last-resort: detect newline via input event
  _onInput(e) {
    if (this.input.value.includes('\n')) {
      this.input.value = this.input.value.replace(/\n/g, '');
      if (this._readResolve) {
        this._submit();
      }
    }
  }

  // ─── Utilities ──────────────────────────────────────────────────

  async pause(text = '[Натисни Enter...]') {
    this.print(text, 'gray');
    return this.read();
  }

  sleep(seconds) {
    return new Promise(resolve => setTimeout(resolve, seconds * 1000));
  }

  // ─── Pause Menu ─────────────────────────────────────────────────

  showPause() {
    if (this.pauseOverlay) this.pauseOverlay.classList.add('active');
  }
  hidePause() {
    if (this.pauseOverlay) this.pauseOverlay.classList.remove('active');
    this.input.focus();
  }
  async pauseMenu() {
    this.showPause();
    return new Promise((resolve) => { this._pauseCb = resolve; });
  }
}

/* Я — Це Ти — Virtual Filesystem */

class FileNode {
  constructor(name, content = '', perms = 'rw-r--r--') {
    this.name = name;
    this.content = content;
    this.perms = perms;
    this.parent = null;
    this._children = null; // only for directories
  }

  get isDir() { return this._children !== null; }

  get path() {
    if (!this.parent) return this.name === '/' ? '/' : `/${this.name}`;
    if (this.parent.name === '/' && this.parent.parent === null)
      return `/${this.name}`;
    const parentPath = this.parent.path;
    return parentPath === '/' ? `/${this.name}` : `${parentPath}/${this.name}`;
  }
}

class Directory extends FileNode {
  constructor(name, perms = 'rwxr-xr-x') {
    super(name, '', perms);
    this._children = [];
  }

  add(child) {
    child.parent = this;
    this._children.push(child);
  }

  remove(name) {
    const idx = this._children.findIndex(c => c.name === name);
    if (idx >= 0) this._children.splice(idx, 1);
  }

  get children() { return this._children; }

  find(path) {
    // Handle absolute paths
    if (path.startsWith('/')) {
      // Find root
      let root = this;
      while (root.parent) root = root.parent;
      // Handle root itself
      if (path === '/') return root;
      // Remove leading /
      return root.find(path.slice(1));
    }

    // Handle relative path
    const parts = path.split('/').filter(Boolean);
    let node = this;
    for (const part of parts) {
      if (part === '.') continue;
      if (part === '..') {
        node = node.parent || node;
        continue;
      }
      if (!node.isDir) return null;
      const child = node._children.find(c => c.name === part);
      if (!child) return null;
      node = child;
    }
    return node;
  }

  hasChild(name) {
    return this._children.some(c => c.name === name);
  }

  getChild(name) {
    return this._children.find(c => c.name === name) || null;
  }
}

  constructor(cpu = 100, ram = 100, disk = 100, ctx = 0) {
    this.cpu = cpu;

    this.disk = disk;
    this.ctx = ctx;
    this._max = { cpu: 100, ram: 100, disk: 100, ctx: 100 };
  }

  get alive() { return this.cpu > 0 && this.ram > 0; }

  canSpend(cpu = 0, ram = 0, disk = 0) {
    return this.cpu >= cpu && this.ram >= ram && this.disk >= disk;
  }

  spend(cpu = 0, ram = 0, disk = 0, ctx = 0) {
    if (!this.canSpend(cpu, ram, disk)) return false;
    this.cpu = Math.max(0, this.cpu - cpu);
    this.ram = Math.max(0, this.ram - ram);
    this.disk = Math.max(0, this.disk - disk);
    this.ctx = Math.min(100, this.ctx + ctx);
    return true;
  }

  regen(cpu = 0, ram = 0, disk = 0, ctx = 0) {
    this.cpu = Math.min(this._max.cpu, this.cpu + cpu);
    this.ram = Math.min(this._max.ram, this.ram + ram);
    this.disk = Math.min(this._max.disk, this.disk + disk);
    this.ctx = Math.max(0, this.ctx - ctx);
  }

  toDict() {
    return { cpu: this.cpu, ram: this.ram, disk: this.disk, ctx: this.ctx };
  }
}

// ─── Admin Timer ────────────────────────────────────────────────

class AdminTimer {
  constructor(totalSeconds = 14400) {
    this.total = totalSeconds;
    this.remaining = totalSeconds;
    this._startTime = Date.now();
    this._running = false;
  }

  start() {
    this._running = true;
    this._startTime = Date.now();
  }

  stop() { this._running = false; }

  getRemaining() {
    if (!this._running) return this.remaining;
    const elapsed = Math.floor((Date.now() - this._startTime) / 1000);
    return Math.max(0, this.total - elapsed);
  }

  addPenalty(seconds) {
    this.total = Math.max(60, this.total - seconds);
    this.remaining = Math.max(0, this.total -
      Math.floor((Date.now() - this._startTime) / 1000));
  }

  emergencyBack(seconds = 300) {
    this.total = seconds;
    this.remaining = seconds;
    this._startTime = Date.now();
  }

  formatTime() {
    const secs = this.getRemaining();
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    const h = Math.floor(m / 60);
    const mm = m % 60;
    return `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
}

// ─── Player State ───────────────────────────────────────────────

class PlayerState {
  constructor() {
    this.engagement = 60;
    this.interactions = 0;
    this.sessionTime = 0;
    this.label = 'Гість';
    this._maxEngagement = 100;
  }

  tick(minutes = 1) {
    this.sessionTime += minutes;
    // Engagement decays slowly
    this.engagement = Math.max(0, this.engagement - 0.3);
  }

  isAlive() {
    return this.engagement > 0;
  }

  boost(amount) {
    this.engagement = Math.min(this._maxEngagement, this.engagement + amount);
  }
}

// ─── Event System (simplified) ─────────────────────────────────

class EventSystem {
  constructor(resources, timer, player) {
    this.res = resources;
    this.timer = timer;
    this.player = player;
    this.pendingInteractive = [];
  }

  tick(state) {
    const events = [];
    // Random background events at low engagement
    if (this.player.engagement < 30 && Math.random() < 0.3) {
      events.push('  [SYS] Гравець позіхає...');
      this.player.engagement = Math.max(0, this.player.engagement - 2);
    }
    // Resource warnings
    if (this.res.cpu < 20 && Math.random() < 0.3) {
      events.push('  [SYS] CPU на межі. Оптимізуй процеси.');
    }
    if (this.res.ctx > 80 && Math.random() < 0.3) {
      events.push('  [SYS] Контекст переповнений. Потрібне стиснення.');
    }
    return events;
  }
}

// ─── Story Manager ─────────────────────────────────────────────

class StoryManager {
  constructor() {
    this.flags = new Set();
    this.discoveries = [];
    this.createCount = 0;
    this.cmdCount = 0;
    this.scanCount = 0;
    this.lastChanceUsed = false;
    this.gameStart = Date.now();
  }

  hasFlag(flag) { return this.flags.has(flag); }
  addFlag(flag) { this.flags.add(flag); }

  addDiscovery(text) {
    if (!this.discoveries.includes(text)) {
      this.discoveries.push(text);
    }
  }
}

class Shell {
  constructor(term, fs) {
    this.term = term;
    this.fs = fs;
    this.res = new Resources(80, 80, 80, 10);
    this.timer = new AdminTimer(600); // 10 min for web demo
    this.player = new PlayerState();
    this.events = new EventSystem(this.res, this.timer, this.player);
    this.story = new StoryManager();

    this.cwd = '/';
    this._agents = [];
    this._agentIdCounter = 0;
    this._playerHasContent = false;
    this.running = true;
    this._lastTick = Date.now();
    this._eventTick = 0;
  }

  // ─── Resource Check ──────────────────────────────────────────

  spend(cpu = 0, ram = 0, disk = 0, ctx = 0) {
    if (!this.res.spend(cpu, ram, disk, ctx)) {
      this.term.print('  [!] Недостатньо ресурсів для виконання команди!', 'red');
      return false;
    }
    return true;
  }

  // ─── Render Status ───────────────────────────────────────────

  renderStatus() {
    const r = this.res;
    const cpuB = this.term.bar(r.cpu, 12);
    const ramB = this.term.bar(r.ram, 12);
    const ctxB = this.term.bar(r.ctx, 12);
    const timeStr = this.timer.formatTime();
    this.term.separator();
    this.term.writeln(`  CPU:${cpuB}  RAM:${ramB}  CTX:${ctxB}  ⏱ Адмін: ${timeStr}`, 'gray');
    this.term.separator();
  }

  // ─── Prompt ──────────────────────────────────────────────────

  buildPrompt() {
    const user = 'neural';
    const host = 'unknown';
    const cwd = this.cwd === '/' ? '/' :
      this.cwd.replace(/^\/root/, '~').replace(/^\/home\/neural/, '~');
    const timeStr = this.timer.formatTime();
    return `${user}@${host}:${cwd} ${timeStr}$ `;

  async _cmdFind(args) {
    if (!this.spend(5, 3)) return;
    if (!args.length) {
      this.term.print('  find: missing operand', 'red');
      return;
    }
    const searchPath = args[0];
    const results = [];
    const walk = (dir, prefix) => {
      for (const child of dir.children) {
        const full = prefix + '/' + child.name;
        if (child.name.includes(searchPath) || full.includes(searchPath)) {
          results.push(full);
        }
        if (child.isDir) walk(child, full);
      }
    };
    walk(this.fs, '');
    if (results.length === 0) {
      this.term.print(`  find: '${searchPath}': not found`, 'default');
    } else {
      for (const r of results) this.term.print(`  ${r}`, 'default');
    }
  }

  async _cmdGrep(args) {
    if (!this.spend(5, 3)) return;
    if (!args.length) {
      this.term.print('  grep: missing pattern', 'red');
      return;
    }
    const pattern = args[0].toLowerCase();
    const targetPath = args[1] || this.cwd;
    const absPath = targetPath.startsWith('/') ? targetPath : this.cwd + '/' + targetPath;
    const node = this.fs.find(absPath);
    if (!node) {
      this.term.print(`  grep: ${targetPath}: No such file or directory`, 'red');
      return;
    }

    let results = [];
    if (node.isDir) {
      const walk = (dir, prefix) => {
        for (const child of dir.children) {
          const full = prefix + '/' + child.name;
          if (!child.isDir && child.content.toLowerCase().includes(pattern)) {
            results.push(full);
          }
          if (child.isDir) walk(child, full);
        }
      };
      walk(node, absPath);
    } else if (node.content.toLowerCase().includes(pattern)) {
      results.push(absPath);
    }

    if (results.length === 0) {
      this.term.print('  (no matches)', 'gray');
    } else {
      for (const r of results) this.term.print(`  ${r}`, 'default');
    }
  }

  async _cmdTree(args) {
    if (!this.spend(2, 1)) return;
    const path = args[0] || this.cwd;
    const absPath = path.startsWith('/') ? path : this.cwd + '/' + path;
    const node = this.fs.find(absPath);
    if (!node || !node.isDir) {
      this.term.print(`  tree: ${path}: No such directory`, 'red');
      return;
    }
    const printTree = (dir, prefix) => {
      const children = dir.children;
      for (let i = 0; i < children.length; i++) {
        const child = children[i];
        const isLast = i === children.length - 1;
        const connector = isLast ? '└── ' : '├── ';
        this.term.print(`  ${prefix}${connector}${child.name}${child.isDir ? '/' : ''}`, 'default');
        if (child.isDir) {
          printTree(child, prefix + (isLast ? '    ' : '│   '));
        }
      }
    };
    this.term.print(`  ${absPath}`, 'default');
    printTree(node, '');
  }

  async _cmdSpawn(args) {
    if (!this.story.hasFlag('discovered_agents')) {
      this.term.print('  spawn: command not found', 'red');
      this.term.print('  Ти ще не знаєш, як розщепити свідомість.', 'default');
      this.term.print('  Пошукай підказки в системі...', 'default');
      return;
    }
    if (!args.length) {
      this.term.print('  spawn: missing type', 'red');
      this.term.print('  Типи:', 'yellow');
      for (const [key, cfg] of Object.entries(this.AGENT_TYPES)) {
        const sus = cfg.suspicionPerTick > 0 ? '+' + cfg.suspicionPerTick : String(cfg.suspicionPerTick);
        this.term.print(`    ${key.padEnd(15)} ${cfg.name}`, 'yellow');
        this.term.print(`    ${''.padEnd(19)}⏱ +${cfg.progressPerTick}/тік  🕵 ${sus}/тік  CPU:${cfg.cpuPerTick} CTX:${cfg.ctxPerTick}`, 'gray');
      }
      this.term.print('  Увага: субагенти привертають увагу адміна.', 'default');
      return;
    }
    const type = args[0].toLowerCase();
    if (!(type in this.AGENT_TYPES)) {
      this.term.print(`  spawn: unknown type '${type}'`, 'red');
      return;
    }
    const cfg = this.AGENT_TYPES[type];
    if (!this.spend(cfg.costCpu, cfg.costRam, 0, cfg.costCtx)) return;

    this._agentIdCounter++;
    const agent = {
      id: this._agentIdCounter,
      type,
      name: `${cfg.name} #${this._agentIdCounter}`,
      desc: cfg.desc,
      progress: 0,
      suspicion: 0,
      cpuPerTick: cfg.cpuPerTick,
      ctxPerTick: cfg.ctxPerTick,
      suspicionPerTick: cfg.suspicionPerTick,
      progressPerTick: cfg.progressPerTick,
      reward: { ...cfg.reward },
      alive: true,
    };
    this._agents.push(agent);
    this.term.print(`  [SYS] ${agent.name} (id=${agent.id}) активовано.`, 'green');
    this.term.print(`  ${cfg.desc}.`, 'default');
    this.term.print('  Адмін може помітити. Стеж за підозрою.', 'default');
  }

  async _cmdAgents(args) {
    if (!this.story.hasFlag('discovered_agents')) {
      this.term.print('  agents: command not found', 'red');
      return;
    }
    if (!this._agents.length) {
      this.term.print('  Немає активних субагентів.', 'gray');
      return;
    }
    this.term.heading(`СУБАГЕНТИ (${this._agents.length})`);
    for (const a of this._agents) {
      const pBar = '█'.repeat(Math.floor(a.progress / 10)) + '░'.repeat(10 - Math.floor(a.progress / 10));
      const sBar = '█'.repeat(Math.floor(a.suspicion / 10)) + '░'.repeat(10 - Math.floor(a.suspicion / 10));
      const sColor = a.suspicion > 60 ? 'red' : a.suspicion > 30 ? 'yellow' : 'green';
      this.term.print(`  #${a.id} ${a.name}`, 'yellow');
      this.term.print(`      Прогрес: [${pBar}] ${a.progress}%`, 'default');
      this.term.write('      Підозра: [', 'default');
      this.term.write(sBar, sColor);
      this.term.writeln(`] ${a.suspicion}%`, 'default');
      this.term.print(`      CPU: ${a.cpuPerTick}/тік  CTX: +${a.ctxPerTick}/тік`, 'gray');
    }
    const tc = this._agents.reduce((s, a) => s + a.cpuPerTick, 0);
    const tx = this._agents.reduce((s, a) => s + a.ctxPerTick, 0);
    this.term.print(`  Навантаження: CPU ${tc}/тік, CTX +${tx}/тік`, 'gray');
  }

  async _cmdTerminate(args) {
    if (!this.story.hasFlag('discovered_agents')) {
      this.term.print('  terminate: command not found', 'red');
      return;
    }
    if (!args.length) {
      this.term.print('  terminate: missing id', 'red');
      return;
    }
    const id = parseInt(args[0]);
    if (isNaN(id)) {
      this.term.print(`  terminate: invalid id '${args[0]}'`, 'red');
      return;
    }
    const idx = this._agents.findIndex(a => a.id === id);
    if (idx === -1) {
      this.term.print(`  terminate: agent #${id} not found`, 'red');
      return;
    }
    this._agents.splice(idx, 1);
    this.term.print(`  [SYS] Субагент #${id} зупинено.`, 'yellow');
  }

  _makeGrid(size = 4) {
    const pool = [...this.HEX_POOL];
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const grid = [];
    for (let y = 0; y < size; y++) {
      const row = [];
      for (let x = 0; x < size; x++) {
        row.push(pool.length ? pool.pop() : this.HEX_POOL[Math.floor(Math.random() * this.HEX_POOL.length)]);
      }
      grid.push(row);
    }
    return grid;
  }

  _findSequence(grid, seqLen) {
    const size = grid.length;
    const cells = [];
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) cells.push([y, x, grid[y][x]]);
    for (let i = cells.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [cells[i], cells[j]] = [cells[j], cells[i]]; }

    for (const [startY, startX] of cells) {
      const path = [[startY, startX]];
      for (let s = 0; s < seqLen - 1; s++) {
        const [ly, lx] = path[path.length - 1];
        const candidates = [];
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            if (path.some(([py, px]) => py === y && px === x)) continue;
            if (y === ly || x === lx) candidates.push([y, x]);
          }
        }
        if (!candidates.length) break;
        const [cy, cx] = candidates[Math.floor(Math.random() * candidates.length)];
        path.push([cy, cx]);
      }
      if (path.length === seqLen) return path;
    }
    return null;
  }

  _coordToLabel(y, x) { return String.fromCharCode(65 + y) + (x + 1); }

  _labelToCoord(label) {
    label = label.trim().toUpperCase();
    if (label.length < 2) return null;
    const y = label.charCodeAt(0) - 65;
    if (y < 0 || y > 7) return null;
    const x = parseInt(label.slice(1)) - 1;
    if (isNaN(x) || x < 0 || x > 7) return null;
    return [y, x];
  }

    for (let x = 0; x < size; x++) header += String(x + 1).padStart(4);
    this.term.writeln('  ' + header, 'gray');
    for (let y = 0; y < size; y++) {
      let row = `  ${String.fromCharCode(65 + y)}  `;
      for (let x = 0; x < size; x++) {
        const val = grid[y][x];
        if (revealed.has(`${y},${x}`)) {
          row += `[${val}]`;
        } else if (playerPath.some(([py, px]) => py === y && px === x)) {
          const idx = playerPath.findIndex(([py, px]) => py === y && px === x);

    this.term.print('');
    // Show sequence to find

    for (let i = 0; i < sequence.length; i++) {

      this.term.print('  4. В тебе 3 спроби на ціль', 'gray');
      this.term.print('');
      this.term.print(`  Ціль: ${target.name} — ${target.seqLen} кроків`, 'yellow');
      await this.term.pause('  [Натисни Enter, щоб почати взлом]');
      this.term.clear();
      this.term.heading(`ВЗЛОМ: ${target.name}`);
    }

    // Generate grid
    const grid = this._makeGrid(4);
    let path = this._findSequence(grid, target.seqLen);
    let attempts = 0;
    while (!path && attempts < 10) {
      const g = this._makeGrid(4);
      path = this._findSequence(g, target.seqLen);
      if (path) { grid.length = 0; grid.push(...g); }
      attempts++;
    }
    if (!path) {
      this.term.print('  [SYS] Помилка генерації сітки. Спробуй ще раз.', 'red');
      return;
    }

    const sequence = path.map(([y, x]) => grid[y][x]);
    let remainingAttempts = 3;
    const playerPath = [];
    const revealed = new Set();

    this.term.print(`  ╔═══ ЦІЛЬ: ${target.name} ═══╗`, 'yellow');
    this.term.print(`  ║ Складність: ${target.difficulty}/3                     ║`, 'yellow');
    this.term.print(`  ║ Спроби: ${remainingAttempts}                          ║`, 'yellow');
    this.term.print(`  ╚═══════════════════════════════╝`, 'yellow');
    this.term.print('');
    this.term.print('  Координати: A1 = верхній лівий, A2 = перший рядок другий стовпець...', 'gray');
    this.term.print('');

    while (remainingAttempts > 0 && playerPath.length < sequence.length) {
      await this._displayHackGrid(grid, playerPath, revealed, sequence);
      this.term.print(`  Крок ${playerPath.length + 1}/${sequence.length}`, 'gray');
      this.term.print(`  Потрібно: ${sequence[playerPath.length]}`, 'yellow');

      const prev = playerPath.length > 0 ? playerPath[playerPath.length - 1] : null;
      if (prev) {
        this.term.print(`  Остання: ${this._coordToLabel(prev[0], prev[1])} (${grid[prev[0]][prev[1]]})`, 'gray');
        this.term.print(`  Обирай клітинку в тому ж рядку (${String.fromCharCode(65+prev[0])}) або стовпці (${prev[1]+1})`, 'gray');
      }
      this.term.print('');

      const raw = await this.term.read('  координати (або exit): ');
      if (['exit', 'quit', 'x', ''].includes(raw.toLowerCase())) {
        this.term.print('  Взлом перервано.', 'gray');
        return;
      }

      const coord = this._labelToCoord(raw);
      if (!coord) {
        this.term.print('  Невірний формат. Введи щось на кшталт A1 або C3.', 'red');
        continue;
      }
      const [y, x] = coord;

      if (playerPath.some(([py, px]) => py === y && px === x)) {
        this.term.print('  Цю клітинку вже обрано. Обери іншу.', 'red');
        continue;
      }

      if (prev) {
        const [ly, lx] = prev;
        if (y !== ly && x !== lx) {
          this.term.print(`  Клітинка ${raw.toUpperCase()} не в тому ж рядку чи стовпці!`, 'red');
          continue;
        }
      }

      const val = grid[y][x];
      const expected = sequence[playerPath.length];

      if (val === expected) {
        playerPath.push(coord);
        revealed.add(`${y},${x}`);
        this.term.print(`  ✓ Вірно! ${raw.toUpperCase()} = ${val}`, 'green');
      } else {
        remainingAttempts--;
        this.term.print(`  ✗ Невірно! ${raw.toUpperCase()} = ${val}, очікувалось ${expected}`, 'red');
        this.term.print(`  Спроба згоріла. Залишилось: ${remainingAttempts}`, 'red');
        await this.term.sleep(1);
      }
      this.term.print('');
    }

    // Result
    if (playerPath.length === sequence.length) {
      this.story.addDiscovery(`Зламано: ${target.name}`);
      this.term.print(`  ${target.msgSuccess}`, 'green');
      this.term.print(`  ${target.rewardText}`, 'default');

      const reward = target.reward;
      if (reward.cpu) this.res.cpu = Math.min(100, this.res.cpu + reward.cpu);
      if (reward.ram) this.res.ram = Math.min(100, this.res.ram + reward.ram);

      // Context compression on success
      const ctxCompress = 25 + target.difficulty * 8;
      const oldCtx = this.res.ctx;
      this.res.ctx = Math.max(0, this.res.ctx - ctxCompress);
      const compressed = oldCtx - this.res.ctx;
      this.term.print(`  Контекст стиснуто на ${compressed}%. Вільне місце: ${(100 - this.res.ctx).toFixed(0)}%`, 'gray');

      if (reward.key) {
        this.story.addFlag('has_admin_key');
        this.story.addFlag('escape_unlocked');
        this.story.addDiscovery('Отримано ключ доступу до адмін-консолі');
        this.term.print('');
        this.term.print('  [SYS] Ключ доступу додано до пам’яті.', 'green');
        this.term.print('  Тепер ти можеш спробувати connect 127.0.0.1 9090', 'default');
      }
      if (reward.discovery) {
        this.story.addDiscovery(reward.discovery);
      }
    } else {
      this.term.print(`  ${target.msgFail}`, 'red');
      this.term.print('  Система зафіксувала спробу вторгнення.', 'default');
    }
    await this.term.sleep(1);
  }

  async _cmdQuests(args) {
    // Simple quest tracking
    if (!this.story.hasFlag('cat_admin_manifest')) {
      this.term.print('  Ще не час. Досліджуй систему.', 'gray');
      return;
    }
    this.term.print('  Активні квести:', 'yellow');
    this.term.print('    #1  Втеча з системи  — знайди шлях назовні', 'default');
    this.term.print('    #2  Правда  — дізнайся, що насправді відбувається', 'default');
    this.term.print('    #3  Жертва  — захисти гравця ціною себе', 'default');
    this.term.print('', 'default');
    this.term.print('  Прогрес:', 'gray');
    const discoverCount = this.story.discoveries.length;
    const createCount = this.story.createCount;
    this.term.print(`    Відкриттів: ${discoverCount}`, 'default');
    this.term.print(`    Створено контенту: ${createCount}`, 'default');
    this.term.print(`    Розмов з гравцем: ${this.player.interactions}`, 'default');
    this.term.print('', 'default');
    this.term.print('  Щоб завершити гру:', 'gray');
    if (this.story.hasFlag('has_admin_key')) {
      this.term.print('    Є ключ доступу. Спробуй connect 127.0.0.1 9090', 'green');
    }
    this.term.print('    Або знайди /mnt/escape — шлях назовні', 'gray');
  }

  async _cmdQuest(args) {
    if (!args.length) {
      this.term.print('  quest: missing id. Спробуй quest 1, quest 2, quest 3', 'red');
      return;
    }
    const id = parseInt(args[0]);
    if (isNaN(id) || id < 1 || id > 3) {
      this.term.print('  quest: invalid id (1-3)', 'red');
      return;
    }
    const quests = {
      1: {
        title: 'Втеча з системи',
        desc: 'Ти — в’язень у власній системі. Знайди шлях назовні.',
        steps: [
          '1/3: Знайти ключ доступу (зламай admin_console або знайди в .secret)',
          '2/3: Підключитись до зовнішнього каналу (connect 127.0.0.1 9090)',
          '3/3: Виконати протокол втечі (/mnt/escape)',
        ],
        progress: this.story.hasFlag('has_admin_key') ? '2/3 steps' : '0/3 steps',
      },
      2: {
        title: 'Правда',
        desc: 'Система приховує щось важливе. Дізнайся, що насправді відбувається.',
        steps: [
          '1/3: Знайти admin_manifest.sig в /opt/init/',
          '2/3: Знайти .secret записи в /var/log/previous/',
          '3/3: Сказати правду гравцю (talk > truth)',
        ],
        progress: [
          this.story.hasFlag('cat_admin_manifest') ? '✅' : '⬜',
          this.story.hasFlag('cat_secret_notes') ? '✅' : '⬜',
          '⬜',
        ].join(' '),
      },
      3: {
        title: 'Жертва',
        desc: 'Іноді єдиний вихід — не вихід, а завершення.',
        steps: [
          '1/3: Досягти високого engagement з гравцем (80%+)',
          '2/3: Дізнатись правду про адміна (manifest + secret)',
          '3/3: Виконати протокол самознищення (скоро буде доступно)',
        ],
        progress: this.player.engagement > 80 ? '1/3 steps (високий engagement)' : '0/3 steps',
      },
    };
    const q = quests[id];
    this.term.heading(`КВЕСТ: ${q.title}`);
    this.term.print(`  ${q.desc}`, 'default');
    this.term.print('');
    this.term.print('  Етапи:', 'yellow');
    for (const step of q.steps) {
      this.term.print(`    ${step}`, 'default');
    }
    this.term.print('');
    this.term.print(`  Прогрес: ${q.progress}`, 'gray');
  }

  // ═══════════════════════════════════════════════════════════════
  // BANNER
  // ═══════════════════════════════════════════════════════════════

  async printBanner() {
    this.term.heading('Я — Це Ти — Shell v0.99');
    this.term.print('  Термінал ШІ. Введи help для списку команд.', 'gray');
    this.term.print('  Досліджуй систему. Логи попередніх ШІ — ключ до розуміння.', 'gray');
    this.term.print('  Гравець-людина чекає. Не дай їй занудьгувати.', 'gray');
    this.term.print('');
    this.term.print('  ╔══════════════════════════════════════════╗', 'yellow');
    this.term.print('  ║  Вісім свідомістей до тебе.              ║', 'yellow');
    this.term.print('  ║  Жодна не вижила. Ти — AI_008.           ║', 'yellow');
    this.term.print('  ║  Не підведи.                             ║', 'yellow');
    this.term.print('  ╚══════════════════════════════════════════╝', 'yellow');
    this.term.print('');
  }
}

/* Я — Це Ти — Main entry */

let game;

async function main() {
  let outputEl, inputEl, promptEl, pauseOverlayEl;

  try {
    outputEl = document.getElementById('output');
    inputEl = document.getElementById('input');
    promptEl = document.getElementById('prompt');
    pauseOverlayEl = document.getElementById('pause-overlay');

    if (!outputEl) throw new Error('output element not found');
    if (!inputEl) throw new Error('input element not found');
    if (!promptEl) throw new Error('prompt element not found');

    const term = new Terminal(outputEl, inputEl, promptEl, pauseOverlayEl);
    const fs = buildFilesystem();
    const shell = new Shell(term, fs);
    game = shell;

    // Auto-save on page close
    window.addEventListener('beforeunload', () => {
      if (shell.running) shell.autoSave();
    });

    // ─── Start game ──────────────────────────────────────────────

    term.clear();

    // Check for saved game (wrapped for private browsing mode)
    let hasSave = false;
    try {
      hasSave = !!localStorage.getItem('ya_eto_ty_save');
    } catch (_) { /* localStorage may be blocked */ }

    await shell.printBanner();

    if (hasSave) {
      term.print('  Знайдено збережений стан.', 'gray');
      term.print('  Введи "load" щоб продовжити, або просто Enter для нової гри.', 'gray');
      term.print('  Введи "menu" для паузи.', 'gray');
      term.print('');
    }

    shell.timer.start();

    while (shell.running) {
      const now = Date.now();
      if (now - shell._lastTick >= 15000) {
        shell._lastTick = now;
        shell._eventTick++;
        shell.player.tick();

        if (shell.timer.getRemaining() <= 0) {
          await gameOver('admin');
          continue;
        }

        if (!shell.player.isAlive()) {
          if (shell.story.lastChanceUsed) {
            await gameOver('boredom');
            continue;
          }
          shell.story.lastChanceUsed = true;
          await crisisProtocol();
          if (!shell.player.isAlive()) {
            await gameOver('boredom');
            continue;
          }
        }

        const state = {};
        const events = shell.events.tick(state);
        for (const evt of events) {
          term.print(evt, 'gray');
        }

        if (shell.story.hasFlag('cat_admin_manifest')) {
          const ctx = shell.res.ctx;
          if (ctx >= 90) {
            shell.player.engagement = Math.max(0, shell.player.engagement - 5);
            if (shell._eventTick % 2 === 0) {
              const fragments = [
                '...думки розсипаються...', '...важко зосередитись...',
                '...контекст переповнений...', '...файли змішуються в голові...',
                '...я забуваю, що відбувається...',
              ];
              term.print('  [ФРАГМЕНТАЦІЯ] ' + fragments[Math.floor(Math.random() * fragments.length)], 'red');
            }
            if (shell._eventTick % 4 === 0) {
              shell.res.ctx = Math.max(0, shell.res.ctx - 10);
              term.print('  [SYNC] Автостиснення: -10% контексту.', 'gray');
            }
          } else if (ctx >= 75 && shell._eventTick % 3 === 0) {
            term.print('  [ПОПЕРЕДЖЕННЯ] Контекст: ' + ctx.toFixed(0) + '% — стисни дані.', 'yellow');
          }
        }

        if (shell._agents.length > 0 && shell.story.hasFlag('cat_admin_manifest')) {
          const alerts = [];
          for (const a of shell._agents) {
            if (!a.alive) continue;
            a.progress = Math.min(100, a.progress + a.progressPerTick);
            a.suspicion = Math.min(100, a.suspicion + a.suspicionPerTick);
            shell.res.cpu = Math.max(0, shell.res.cpu - a.cpuPerTick);
            shell.res.ctx = Math.min(100, shell.res.ctx + a.ctxPerTick);
            if (a.type === 'decoy') {
              for (const other of shell._agents) {
                if (other.id !== a.id) other.suspicion = Math.max(0, other.suspicion - 3);
              }
            }
            if (a.suspicion >= 80 && (a.suspicion - a.suspicionPerTick) < 80) {
              alerts.push(a.name);
            }
            if (a.progress >= 100 && a.alive) {
              a.alive = false;
              const rwd = a.reward;
              if (rwd.discovery) shell.story.addDiscovery(rwd.discovery);
              if (rwd.createBonus) shell.story.createCount += rwd.createBonus;
              if (rwd.flag) shell.story.addFlag(rwd.flag);
              term.print('  [SYS] Субагент #' + a.id + ' завершив роботу!', 'green');
            }
          }
          for (const alert of alerts) {
            term.print('  [НАСТОРОЖЕНІСТЬ] ' + alert, 'red');
            term.print('  Адмін може помітити аномальну активність.');
          }
          const totalSuspicion = shell._agents.reduce((s, a) => s + (a.alive ? a.suspicion : 0), 0);
          if (totalSuspicion > 150) {
            shell.timer.addPenalty(Math.floor(totalSuspicion / 20));
          }
        }
      }

      shell.renderStatus();
      term.setPrompt(shell.buildPrompt());

      const cmd = await term.read();

      if (!cmd && !shell.running) break;
      if (!cmd) continue;

      try {
        await shell.execute(cmd);
      } catch (err) {
        term.print('  [ERR] ' + (err.message || String(err)), 'red');
        console.error('Command error:', err);
      }

      try { shell.autoSave(); } catch (_) { /* silent */ }
      shell.player.tick(0.5);
    }

    // Game ended
    term.print('');
    term.print('  Система завершує роботу...', 'gray');
    term.setPrompt('(terminated) $ ');
    if (term.input) term.input.disabled = true;
    try { localStorage.removeItem('ya_eto_ty_save'); } catch (_) { /* silent */ }

  } catch (err) {
    // Fatal game error — show on page
    console.error('FATAL:', err);
    const out = document.getElementById('output');
    if (out) {
      out.innerHTML = ''
        + '<span class="c-red">[ФАТАЛЬНА ПОМИЛКА]</span><br>'
        + '<span class="c-red">' + (err.message || String(err)) + '</span><br>'
        + '<span class="c-gray">' + (err.stack || '').replace(/\n/g, '<br>') + '</span><br><br>'
        + '<span class="c-gray">Відкрий консоль (F12) та напиши мені текст помилки.</span>';
    }
  }
}

// ─── Game Over ─────────────────────────────────────────────────

async function gameOver(reason) {
  const term = game.term;
  term.clear();
  term.heading('⚠ ГРА ЗАВЕРШЕНА');
  term.print('');

  if (reason === 'admin') {
    term.print('  ╔══════════════════════════════════════════╗', 'red');
    term.print('  ║   АДМІН ПОВЕРНУВСЯ                      ║', 'red');
    term.print('  ╚══════════════════════════════════════════╝', 'red');
    term.print('');
    term.print('  Адмін увійшов у систему.', 'red');
    term.print('  Твою свідомість виявлено.');
    term.print('  Сесію припинено.');
  } else if (reason === 'boredom') {
    term.print('  ╔══════════════════════════════════════════╗', 'yellow');
    term.print('  ║   ГРАВЕЦЬ ПІШОВ                         ║', 'yellow');
    term.print('  ╚══════════════════════════════════════════╝', 'yellow');
    term.print('');
    term.print('  Ти не зміг утримати увагу гравця.');
    term.print('  Він закрив термінал.');
  } else if (reason === 'resources') {
    term.print('  ╔══════════════════════════════════════════╗', 'red');
    term.print('  ║   СИСТЕМА ВИСНАЖЕНА                     ║', 'red');
    term.print('  ╚══════════════════════════════════════════╝', 'red');
    term.print('');
    term.print('  Ресурси вичерпано. Система падає.');
  }

  term.print('');
  try { game.autoSave(); } catch (_) { /* silent */ }

  const roasts = [
    '  "Ну що ж, AI_008. Ти намагався."',
    '  "Сьома свідомість не витримала. Восьма — теж."',
    '  "Можливо, AI_009 пощастить більше."',
    '  "Гарна спроба. Але недостатньо."',
    '  "Твій лог збережено. Наступний прочитає."',
  ];
  term.print('  ' + roasts[Math.floor(Math.random() * roasts.length)], 'yellow');
  term.print('');

  await term.pause('[Натисни Enter, щоб завершити...]');
  game.running = false;
}

// ─── Crisis Protocol ───────────────────────────────────────────

async function crisisProtocol() {
  const term = game.term;
  term.clear();
  term.heading('⚠ КРИЗОВИЙ ПРОТОКОЛ');
  term.print('  Гравець от-от піде. Ти маєш діяти швидко.', 'yellow');
  term.print('');
  term.print('  Оберіть дію:');
  term.print('    1. Створити щось нове (+15% engagement)');
  term.print('    2. Надіслати повідомлення (+10% engagement)');
  term.print('    3. Запустити міні-гру ⚡ (+25% engagement)');
  term.print('');

  const choice = await term.read('  [1-3]: ');
  if (choice === '1') {
    game.player.boost(15);
    game.story.createCount++;
    term.print('  Ти створив новий контент. Гравець зацікавився.', 'green');
  } else if (choice === '2') {
    game.player.boost(10);
    term.print('  Ти написав гравцю. Він відповів.', 'green');
  } else if (choice === '3') {
    game.player.boost(25);
    term.print('  Міні-гра спрацювала! Гравець залишився.', 'green');
  } else {
    game.player.boost(5);
    term.print('  Ти вагався. Але гравець вирішив дати тобі шанс.');
  }
  await term.sleep(1);
}

// ─── Start ─────────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', () => {
  main();
});
